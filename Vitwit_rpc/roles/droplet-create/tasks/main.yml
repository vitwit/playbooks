# Wait for SSH
- name: Wait for instance to boot
  pause:
    seconds: 40

# Add host dynamically
- name: Add node to inventory
  add_host:
    name: mainnet-node
    ansible_host: "{{ node_ip }}"
    ansible_user: "{{ user }}"
    groups: mainnet